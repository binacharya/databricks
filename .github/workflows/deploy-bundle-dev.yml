name: Deploy bundle (dev)

on:
  push:
    branches: [dev]


jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          n=0
          until [ $n -ge 3 ]; do
            databricks bundle validate -t dev && exit 0
            n=$((n+1))
            echo "Attempt $n failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Deploy bundle (dev)
        run: |
          n=0
          until [ $n -ge 3 ]; do
            databricks bundle deploy -t dev && exit 0
            n=$((n+1))
            echo "Attempt $n failed, retrying in 10s..."
            sleep 10
          done
          exit 1
