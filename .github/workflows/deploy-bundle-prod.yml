name: Deploy bundle (prod)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Debug host format (no secret leaked)
        run: |
          echo "Host length: ${#DATABRICKS_HOST}"
          echo "Starts with https://: $([[ "$DATABRICKS_HOST" == https://* ]] && echo yes || echo no)"
          echo "Ends with slash: $([[ "$DATABRICKS_HOST" == */ ]] && echo yes || echo no)"
          echo "Has trailing whitespace/newline: $([[ "$DATABRICKS_HOST" =~ [[:space:]]$ ]] && echo yes || echo no)"
          echo "Token length: ${#DATABRICKS_TOKEN}"

      - name: Validate bundle
        run: |
          n=0
          until [ $n -ge 3 ]; do
            databricks bundle validate -t prod && exit 0
            n=$((n+1))
            echo "Attempt $n failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Deploy bundle (prod)
        run: |
          n=0
          until [ $n -ge 3 ]; do
            databricks bundle deploy -t prod && exit 0
            n=$((n+1))
            echo "Attempt $n failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Determine changed dbt models
        id: changed_models
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "select=fqn:*" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_MODELS=$(git diff --name-only "$BEFORE" "$AFTER" -- models | grep '\.sql$' || true)
          CHANGED_SEEDS=$(git diff --name-only "$BEFORE" "$AFTER" -- seeds | grep '\.csv$' || true)

          if [ -z "$CHANGED_MODELS" ] && [ -z "$CHANGED_SEEDS" ]; then
            echo "select=fqn:*" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SELECT=""
          for f in $CHANGED_MODELS $CHANGED_SEEDS; do
            name=$(basename "$f" | sed -E 's/\.(sql|csv)$//')
            SELECT="$SELECT ${name}+"
          done

          echo "select=$(echo $SELECT | xargs)" >> "$GITHUB_OUTPUT"

      - name: Run dbt pipeline job
        run: databricks bundle run dbt_databricks_job -t prod --params dbt_select="${{ steps.changed_models.outputs.select }}"
