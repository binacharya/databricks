name: Deploy bundle (prod)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Debug host format (no secret leaked)
        run: |
          echo "Host length: ${#DATABRICKS_HOST}"
          echo "Starts with https://: $([[ "$DATABRICKS_HOST" == https://* ]] && echo yes || echo no)"
          echo "Ends with slash: $([[ "$DATABRICKS_HOST" == */ ]] && echo yes || echo no)"
          echo "Has trailing whitespace/newline: $([[ "$DATABRICKS_HOST" =~ [[:space:]]$ ]] && echo yes || echo no)"
          echo "Token length: ${#DATABRICKS_TOKEN}"

      - name: Validate bundle
        run: |
          n=0
          until [ $n -ge 3 ]; do
            databricks bundle validate -t prod && exit 0
            n=$((n+1))
            echo "Attempt $n failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Deploy bundle (prod)
        run: |
          n=0
          until [ $n -ge 3 ]; do
            databricks bundle deploy -t prod && exit 0
            n=$((n+1))
            echo "Attempt $n failed, retrying in 10s..."
            sleep 10
          done
          exit 1
