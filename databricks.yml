bundle:
  name: DBT automation job from code

variables:
  warehouse_id:
    description: SQL warehouse ID for the dbt task (overridden per target)
    default: "71f300dac76fbcab"
  warehouse_id_dev:
    description: SQL warehouse ID for dev target
    default: "71f300dac76fbcab"
  warehouse_id_prod:
    description: SQL warehouse ID for prod target
    default: "71f300dac76fbcab"
  catalog:
    description: Unity catalog name for dbt
    default: workspace

include:
  - "resources/DBT_automation_job _from_code.yml"


targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/acharyabina01@gmail.com/databricks
    variables:
      warehouse_id: ${var.warehouse_id_dev}
      catalog: workspace

  prod:
    mode: production
    default: false
    workspace:
      root_path: /Workspace/Users/acharyabina01@gmail.com/databricks
    variables:
      warehouse_id: ${var.warehouse_id_prod}
      catalog: workspace