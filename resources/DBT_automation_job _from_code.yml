resources:
  jobs:
    dbt_databricks_job:
      name: "DBT automation job from code"
      parameters:
        - name: dbt_select
          default: "fqn:*"
      tasks:
        - task_key: dbt_pipeline_run
          dbt_task:
            project_directory: ${workspace.root_path}/files/
            commands:
              - dbt deps
              - dbt seed
              - dbt snapshot
              - dbt build --select "{{job.parameters.dbt_select}}"
            warehouse_id: ${var.warehouse_id}
            catalog:  ${var.catalog}
            source: WORKSPACE
          email_notifications:
            on_success:
              - acharyabina01@gmail.com
            on_failure:
              - acharyabina01@gmail.com
          environment_key: dbt-default
        - task_key: null_percentage_check
          depends_on:
            - task_key: dbt_pipeline_run
          spark_python_task:
            python_file: ../scripts/check_null_percentage.py
            source: WORKSPACE
          environment_key: python-dq-default
        - task_key: send_null_report
          depends_on:
            - task_key: null_percentage_check
          spark_python_task:
            python_file: ../scripts/send_null_report_email.py
            source: WORKSPACE
          environment_key: python-dq-default
      queue:
        enabled: true
      environments:
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "4"
        - environment_key: python-dq-default
          spec:
            dependencies:
              - fpdf2>=2.7.0,<3
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
