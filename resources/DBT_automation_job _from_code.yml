resources:
  jobs:
    dbt_databricks_job:
      name: "DBT automation job from code"
      schedule:
        quartz_cron_expression: 44 6 15 * * ?
        timezone_id: Asia/Katmandu
        pause_status: UNPAUSED
      tasks:
        - task_key: dbt_pipeline_run
          dbt_task:
            project_directory: ${workspace.root_path}/files/
            commands:
              - dbt deps
              - dbt seed
              - dbt snapshot
              - dbt debug
            warehouse_id: ${var.warehouse_id}
            catalog:  ${var.catalog}
            source: WORKSPACE
          email_notifications:
            on_success:
              - acharyabina01@gmail.com
            on_failure:
              - acharyabina01@gmail.com
          environment_key: dbt-default
      queue:
        enabled: true
      environments:
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
